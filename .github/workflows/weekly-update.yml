name: 每周 Profile 自动更新
on:
  schedule:
    - cron: '0 14 * * 0'  # 每周日 UTC 14:00（北京时间 22:00）
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: pip install anthropic python-dotenv
      - name: 运行 repo_analyzer（增量分析 + 更新追踪配置）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: python3 repo_analyzer.py --skip-readme-gen
      - name: 运行 update_profile（更新项目列表）
        env:
          GH_OWNER: ${{ github.repository_owner }}
        run: python3 update_profile.py --no-push
      - name: 运行 weekly_report（生成周报 + 更新本周进展）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: python3 weekly_report.py --no-push
      - name: Commit & Push 到 projectmanagement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly-reports/ profile.md tracked_config.json repo_database.md
          git diff --staged --quiet \
            || git commit -m "chore: 自动周报 $(date -u +%Y-W%V)"
          git push
      - name: 同步个人主页 README
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # PROFILE_REPO 可在仓库 Variables 中覆盖，默认为 owner/owner（Profile README 仓库惯例）
          PROFILE_REPO: ${{ vars.PROFILE_REPO || format('{0}/{0}', github.repository_owner) }}
        run: |
          sha=$(gh api /repos/${PROFILE_REPO}/contents/README.md \
                --jq '.sha' 2>/dev/null || echo "")
          content=$(base64 -w 0 profile.md)
          if [ -n "$sha" ]; then
            gh api --method PUT \
              /repos/${PROFILE_REPO}/contents/README.md \
              -f message="chore: sync profile" \
              -f content="$content" \
              -f sha="$sha"
            echo "✅ 个人主页 README 已同步（${PROFILE_REPO}）"
          else
            echo "⚠️  README.md 未找到或无权访问（检查 PROJECT_TOKEN 和 PROFILE_REPO=${PROFILE_REPO}）"
            exit 1
          fi
