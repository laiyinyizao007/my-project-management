name: Auto Create Sprint

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 UTC 01:00（北京时间 09:00）
  workflow_dispatch:

jobs:
  create-sprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectNum = parseInt(process.env.PROJECT_NUMBER);
            const owner = context.repo.owner;

            // 查询 Sprint 迭代字段
            const data = await github.graphql(`
              query($login: String!, $num: Int!) {
                user(login: $login) {
                  projectV2(number: $num) {
                    fields(first: 30) {
                      nodes {
                        __typename
                        ... on ProjectV2IterationField {
                          id name
                          configuration {
                            iterations           { id title startDate duration }
                            completedIterations  { id title startDate duration }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { login: owner, num: projectNum });

            const project = data.user?.projectV2;
            if (!project) { console.log(`Project #${projectNum} not found`); return; }

            const sprintField = project.fields.nodes.find(
              f => f.__typename === 'ProjectV2IterationField' && f.name === 'Sprint'
            );
            if (!sprintField) { console.log('Sprint field not found, run setup-project-board.ps1 first'); return; }

            const active    = sprintField.configuration.iterations ?? [];
            const completed = sprintField.configuration.completedIterations ?? [];

            // 计算下一个 Sprint 编号
            const allNums = [...active, ...completed]
              .map(i => parseInt(i.title.replace(/^Sprint\s*/i, '')))
              .filter(n => Number.isFinite(n));
            const nextNum = allNums.length > 0 ? Math.max(...allNums) + 1 : 1;

            // 本周一日期
            const today    = new Date();
            const daysBack = today.getUTCDay() === 0 ? 6 : today.getUTCDay() - 1;
            const monday   = new Date(today);
            monday.setUTCDate(today.getUTCDate() - daysBack);
            const startDate = monday.toISOString().split('T')[0];

            // 本周已有迭代则跳过
            if (active.some(i => i.startDate === startDate)) {
              console.log(`Sprint for week ${startDate} already exists, skipping`);
              return;
            }

            // 保留现有 active 迭代，追加新 Sprint（内联写，无法用类型变量）
            const allIters = [
              ...active.map(i => ({ id: i.id, title: i.title, startDate: i.startDate, duration: i.duration })),
              { title: `Sprint ${nextNum}`, startDate, duration: 7 }
            ];
            const configStart = active.length > 0 ? active[0].startDate : startDate;
            const itersInline = allIters
              .map(i => `{ ${i.id ? `id: "${i.id}" ` : ''}title: "${i.title}" startDate: "${i.startDate}" duration: ${i.duration} }`)
              .join(' ');

            await github.graphql(`
              mutation($fid: ID!) {
                updateProjectV2Field(input: {
                  fieldId: $fid
                  iterationConfiguration: {
                    startDate: "${configStart}"
                    duration: 7
                    iterations: [${itersInline}]
                  }
                }) { projectV2Field { ... on ProjectV2IterationField { id } } }
              }`, { fid: sprintField.id });

            console.log(`✅ Sprint ${nextNum} created (${startDate})`);
