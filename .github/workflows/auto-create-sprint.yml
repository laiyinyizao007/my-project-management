name: Auto Create Sprint

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 UTC 01:00（北京时间 09:00）
  workflow_dispatch:

jobs:
  create-sprint:
    runs-on: ubuntu-latest
    outputs:
      sprint_title: ${{ steps.create-sprint.outputs.sprint_title }}
      rolled_over: ${{ steps.create-sprint.outputs.rolled_over }}
    steps:
      - uses: actions/github-script@v7
        id: create-sprint
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectNum = parseInt(process.env.PROJECT_NUMBER);
            const owner = context.repo.owner;

            // 本周一日期（与 weekly-plan.yml / create-milestone.yml 相同算法）
            const now      = new Date();
            const dayNum   = now.getUTCDay() || 7;                     // 周日 0 → 7
            const monday   = new Date(now);
            monday.setUTCDate(now.getUTCDate() + (1 - dayNum));
            const startDate = monday.toISOString().split('T')[0];

            // ISO 8601 周数计算（处理跨年边界）
            const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));   // 移到本周周四
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNum   = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
            const isoYear   = d.getUTCFullYear();
            const weekStr   = String(weekNum).padStart(2, '0');
            const sprintTitle = `Sprint ${isoYear}-W${weekStr}`;

            // 提前设置 outputs（在 early-return 前，确保 call-weekly-plan job 始终有值）
            core.setOutput('sprint_title', sprintTitle);
            core.setOutput('start_date', startDate);

            // 查询 Sprint 迭代字段和 Project ID
            // 使用 repositoryOwner 同时兼容 User 和 Organization 账号
            const data = await github.graphql(`
              query($login: String!, $num: Int!) {
                repositoryOwner(login: $login) {
                  ... on User {
                    projectV2(number: $num) {
                      id
                      fields(first: 30) {
                        nodes {
                          __typename
                          ... on ProjectV2IterationField {
                            id name
                            configuration {
                              iterations           { id title startDate duration }
                              completedIterations  { id title startDate duration }
                            }
                          }
                        }
                      }
                    }
                  }
                  ... on Organization {
                    projectV2(number: $num) {
                      id
                      fields(first: 30) {
                        nodes {
                          __typename
                          ... on ProjectV2IterationField {
                            id name
                            configuration {
                              iterations           { id title startDate duration }
                              completedIterations  { id title startDate duration }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { login: owner, num: projectNum });

            const project = data.repositoryOwner?.projectV2;
            if (!project) { console.log(`Project #${projectNum} not found`); core.setOutput('rolled_over', '0'); return; }
            const projectId = project.id;

            const sprintField = project.fields.nodes.find(
              f => f.__typename === 'ProjectV2IterationField' && f.name === 'Sprint'
            );
            if (!sprintField) { console.log('Sprint field not found, run setup-project-board.ps1 first'); core.setOutput('rolled_over', '0'); return; }

            const active    = sprintField.configuration.iterations ?? [];
            const completed = sprintField.configuration.completedIterations ?? [];

            // 本周已有迭代则跳过创建，call-weekly-plan job 仍会执行
            if (active.some(i => i.startDate === startDate)) {
              console.log(`Sprint for week ${startDate} already exists, skipping`);
              core.setOutput('rolled_over', '0');
              return;
            }

            // 找上一个 Sprint（用于续期）
            const allKnownSprints = [...active, ...completed]
              .sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
            const previousSprintId = allKnownSprints[0]?.id ?? null;

            // 保留现有 active 迭代，追加新 Sprint
            const allIters = [
              ...active.map(i => ({ id: i.id, title: i.title, startDate: i.startDate, duration: i.duration })),
              { title: sprintTitle, startDate, duration: 7 }
            ];
            const configStart = active.length > 0 ? active[0].startDate : startDate;
            const itersInline = allIters
              .map(i => `{ ${i.id ? `id: "${i.id}" ` : ''}title: "${i.title}" startDate: "${i.startDate}" duration: ${i.duration} }`)
              .join(' ');

            await github.graphql(`
              mutation($fid: ID!) {
                updateProjectV2Field(input: {
                  fieldId: $fid
                  iterationConfiguration: {
                    startDate: "${configStart}"
                    duration: 7
                    iterations: [${itersInline}]
                  }
                }) { projectV2Field { ... on ProjectV2IterationField { id } } }
              }`, { fid: sprintField.id });

            console.log(`✅ ${sprintTitle} created (${startDate})`);

            // ── Sprint 续期：把上一个 Sprint 未完成的 Issue 移到新 Sprint ──

            if (!previousSprintId) {
              console.log('No previous sprint, skipping rollover');
              core.setOutput('rolled_over', '0');
              return;
            }

            // 重新查询以获取新 Sprint 的 iteration ID
            const updatedField = await github.graphql(`
              query($fid: ID!) {
                node(id: $fid) {
                  ... on ProjectV2IterationField {
                    configuration {
                      iterations { id title startDate }
                    }
                  }
                }
              }`, { fid: sprintField.id });

            const newSprintId = updatedField.node.configuration.iterations
              .find(i => i.startDate === startDate)?.id;

            if (!newSprintId) {
              console.log('Could not find new sprint ID, skipping rollover');
              core.setOutput('rolled_over', '0');
              return;
            }

            // 分页遍历所有 Project items，找属于上一个 Sprint 且未关闭的
            let hasNextPage = true;
            let cursor = null;
            let rolledOver = 0;

            while (hasNextPage) {
              const itemsData = await github.graphql(`
                query($pid: ID!, $cursor: String) {
                  node(id: $pid) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content {
                            ... on Issue { state }
                            ... on PullRequest { state }
                          }
                          fieldValues(first: 20) {
                            nodes {
                              __typename
                              ... on ProjectV2ItemFieldIterationValue {
                                iterationId
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }`, { pid: projectId, cursor });

              const page = itemsData.node.items;
              hasNextPage = page.pageInfo.hasNextPage;
              cursor = page.pageInfo.endCursor;

              for (const item of page.nodes) {
                const inPreviousSprint = item.fieldValues.nodes.some(
                  fv => fv.__typename === 'ProjectV2ItemFieldIterationValue' &&
                        fv.iterationId === previousSprintId
                );
                if (!inPreviousSprint) continue;
                if (item.content?.state !== 'OPEN') continue;

                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { iterationId: $iterationId }
                    }) { projectV2Item { id } }
                  }`, {
                    projectId,
                    itemId: item.id,
                    fieldId: sprintField.id,
                    iterationId: newSprintId
                  });
                rolledOver++;
              }
            }

            console.log(`🔄 Rolled over ${rolledOver} incomplete item(s) to ${sprintTitle}`);
            core.setOutput('rolled_over', String(rolledOver));

  call-weekly-plan:
    needs: create-sprint
    uses: ./.github/workflows/weekly-plan.yml
    with:
      sprint_title: ${{ needs.create-sprint.outputs.sprint_title }}
      rolled_over: ${{ needs.create-sprint.outputs.rolled_over }}
    secrets: inherit
