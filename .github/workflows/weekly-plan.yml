name: Create Weekly Plan Issue

on:
  workflow_call:
    inputs:
      sprint_title:
        description: 'Sprint 名称（由 auto-create-sprint 传入）'
        type: string
        default: ''
      rolled_over:
        description: '续期 Issue 数量'
        type: string
        default: '0'
  workflow_dispatch:
    inputs:
      sprint_title:
        description: 'Sprint 名称（留空则自动计算当周）'
        required: false
        default: ''
      rolled_over:
        description: '续期 Issue 数量'
        required: false
        default: '0'

permissions:
  issues: write
  contents: read

jobs:
  create-weekly-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 安装依赖
        run: pip install anthropic
      - name: 生成并创建周计划 Issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          SPRINT_TITLE: ${{ inputs.sprint_title }}
          ROLLED_OVER: ${{ inputs.rolled_over }}
          GH_OWNER: ${{ github.repository_owner }}
        run: python3 generate_weekly_plan.py
