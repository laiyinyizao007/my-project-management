name: Create Weekly Plan Issue

on:
  schedule:
    # 每周一 UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-weekly-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly plan issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const year = now.getFullYear();

            // 计算 ISO 周数
            const startOfYear = new Date(year, 0, 1);
            const dayOfYear = Math.floor((now - startOfYear) / 86400000) + 1;
            const weekNum = Math.ceil((dayOfYear + startOfYear.getDay()) / 7);
            const weekStr = String(weekNum).padStart(2, '0');

            // 格式化日期
            const dateStr = now.toISOString().split('T')[0];

            // 计算本周日期范围（周一到周五）
            const monday = new Date(now);
            monday.setDate(now.getDate() - now.getDay() + 1);
            const friday = new Date(monday);
            friday.setDate(monday.getDate() + 4);
            const mondayStr = monday.toISOString().split('T')[0];
            const fridayStr = friday.toISOString().split('T')[0];

            const title = `[Weekly] ${year}-W${weekStr} (${mondayStr} ~ ${fridayStr})`;

            const body = `## 本周计划 ${year}-W${weekStr}

> 时间范围：${mondayStr} ~ ${fridayStr}

### 本周目标
- [ ]
- [ ]
- [ ]

### 优先级任务

| 任务 | 优先级 | 截止日期 | Issue |
|------|--------|----------|-------|
|      | P1     |          |       |
|      | P2     |          |       |
|      | P2     |          |       |

### 上周回顾

**已完成：**

**未完成及原因：**

### 本周风险与依赖

**风险：**

**外部依赖：**

---
> 此 Issue 由 GitHub Actions 自动创建。[查看工作流](.github/workflows/weekly-plan.yml)
`;

            // 检查本周是否已创建过
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'type: weekly-plan',
              state: 'open',
              per_page: 5,
            });

            const alreadyExists = existing.data.some(issue =>
              issue.title.includes(`${year}-W${weekStr}`)
            );

            if (alreadyExists) {
              console.log(`本周计划 Issue 已存在，跳过创建。`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              labels: ['type: weekly-plan'],
              body: body,
            });

            console.log(`已创建：${title}`);
