name: Auto-deploy to New Repos

on:
  # push 到 main 且改动了可部署文件时，自动全量同步到所有仓库
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/scripts/**'
  # Cloudflare Worker 触发（新仓库创建时）
  repository_dispatch:
    types: [new-repo-created]
  # 每 6 小时全量扫描（兜底）
  schedule:
    - cron: '17 */6 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      target_repo:
        description: '指定仓库（留空则扫描所有）'
        required: false
        default: ''
      force_update:
        description: '强制更新已存在的 workflow 文件（用于推送修复）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      # push 触发时始终强制更新；手动触发时遵从输入；其他触发（schedule/dispatch）默认 false
      FORCE_UPDATE: ${{ github.event_name == 'push' && 'true' || inputs.force_update || 'false' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
    steps:
      - name: Deploy workflows
        run: |
          OWNER=$(gh api user --jq '.login')
          SOURCE="$GITHUB_REPOSITORY"
          # 排除列表：仅在管理仓库运行的 workflow，不部署到目标仓库
          # 新增仅管理仓库的 workflow 时，在此同步更新（install-to-repo.ps1 有镜像列表）
          EXCLUDE="auto-deploy-to-new-repos.yml auto-create-sprint.yml weekly-plan.yml create-milestone.yml sync-labels.yml"
          PROJECT_NUM="${{ vars.PROJECT_NUMBER }}"

          # 动态枚举源仓库中所有待部署 workflow
          WORKFLOWS=$(gh api "repos/${SOURCE}/contents/.github/workflows" --jq '.[].name' | while read -r name; do
            skip=false
            for ex in $EXCLUDE; do
              [[ "$name" == "$ex" ]] && skip=true && break
            done
            $skip || echo ".github/workflows/$name"
          done)

          # 动态枚举 .github/scripts/ 中所有脚本（无排除列表）
          SCRIPTS=$(gh api "repos/${SOURCE}/contents/.github/scripts" --jq '.[].name' 2>/dev/null | \
            while read -r name; do echo ".github/scripts/$name"; done)

          deploy_file() {
            local repo="$1" path="$2" content="$3"
            local existing_sha
            existing_sha=$(gh api "repos/${repo}/contents/${path}" --jq '.sha' 2>/dev/null) || existing_sha=""

            if [[ -n "$existing_sha" && "$existing_sha" != "null" ]]; then
              if [[ "$FORCE_UPDATE" == "true" ]]; then
                jq -n --arg c "$content" --arg s "$existing_sha" \
                  "{\"message\":\"chore: update $(basename $path)\",\"content\":\$c,\"sha\":\$s}" \
                | gh api "repos/${repo}/contents/${path}" --method PUT --input - >/dev/null
                echo "  🔄 $(basename $path): 已更新"
              else
                echo "  ⏭️  $(basename $path): 已存在"
              fi
              return
            fi

            jq -n --arg c "$content" \
              "{\"message\":\"chore: deploy $(basename $path)\",\"content\":\$c}" \
            | gh api "repos/${repo}/contents/${path}" --method PUT --input - >/dev/null
            echo "  ✅ $(basename $path): 已部署"
          }

          deploy_to() {
            local repo="$1"
            [[ "$repo" == "$SOURCE" ]] && return

            # 检查 workflows 和 scripts 是否已全部存在
            local all_ok=true
            while IFS= read -r wf; do
              gh api "repos/${repo}/contents/${wf}" &>/dev/null 2>&1 || { all_ok=false; break; }
            done <<< "$WORKFLOWS"
            if $all_ok && [[ -n "$SCRIPTS" ]]; then
              while IFS= read -r sc; do
                gh api "repos/${repo}/contents/${sc}" &>/dev/null 2>&1 || { all_ok=false; break; }
              done <<< "$SCRIPTS"
            fi

            if $all_ok && [[ "$FORCE_UPDATE" != "true" ]]; then
              echo "⏭️  ${repo}: 已全部部署，跳过"
              return
            fi

            echo "🚀 部署到 ${repo}..."
            while IFS= read -r wf; do
              content=$(gh api "repos/${SOURCE}/contents/${wf}" --jq '.content' | tr -d '\n')
              deploy_file "$repo" "$wf" "$content"
            done <<< "$WORKFLOWS"
            if [[ -n "$SCRIPTS" ]]; then
              while IFS= read -r sc; do
                content=$(gh api "repos/${SOURCE}/contents/${sc}" --jq '.content' | tr -d '\n')
                deploy_file "$repo" "$sc" "$content"
              done <<< "$SCRIPTS"
            fi

            gh variable set PROJECT_NUMBER --body "$PROJECT_NUM" --repo "$repo"
            gh secret set PROJECT_TOKEN --body "$GH_TOKEN" --repo "$repo"

            if [[ -n "$ANTHROPIC_API_KEY" ]]; then
              gh secret set ANTHROPIC_API_KEY --body "$ANTHROPIC_API_KEY" --repo "$repo"
            fi
            if [[ -n "$ANTHROPIC_BASE_URL" ]]; then
              gh secret set ANTHROPIC_BASE_URL --body "$ANTHROPIC_BASE_URL" --repo "$repo"
            fi

            printf '{"default_workflow_permissions":"write","can_approve_pull_request_reviews":false}' \
            | gh api "repos/${repo}/actions/permissions/workflow" \
                --method PUT --input - >/dev/null

            KEEP=$(printf '# auto-generated\n' | base64 | tr -d '\n')
            jq -n --arg c "$KEEP" '{"message":"chore: init .github","content":$c}' \
            | gh api "repos/${repo}/contents/.github/.keep" \
                --method PUT --input - >/dev/null || true

            echo "✅ ${repo}: 完成"
          }

          # repository_dispatch：部署到指定仓库
          TARGET="${{ github.event.client_payload.repo }}"
          # workflow_dispatch 手动指定
          [[ -z "$TARGET" ]] && TARGET="${{ inputs.target_repo }}"

          if [[ -n "$TARGET" ]]; then
            deploy_to "$TARGET"
          else
            # 定时扫描：遍历所有未归档仓库
            DEPLOYED=0
            REPOS=$(gh api user/repos --paginate \
              --jq '[.[] | select(.archived == false) | .full_name] | .[]')
            for repo in $REPOS; do
              deploy_to "$repo" && DEPLOYED=$((DEPLOYED + 1)) || true
            done
            echo "📊 本次处理 ${DEPLOYED} 个仓库"
          fi
