name: Auto-deploy to New Repos

on:
  # Cloudflare Worker 触发（新仓库创建时）
  repository_dispatch:
    types: [new-repo-created]
  # 每 6 小时全量扫描（兜底）
  schedule:
    - cron: '17 */6 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      target_repo:
        description: '指定仓库（留空则扫描所有）'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Deploy add-to-project workflow
        run: |
          OWNER=$(gh api user --jq '.login')
          SOURCE="${OWNER}/my-project-management"
          WF1=".github/workflows/auto-add-to-project.yml"
          WF2=".github/workflows/auto-set-project-fields.yml"
          PROJECT_NUM="${{ vars.PROJECT_NUMBER }}"

          # 获取源 workflow 内容
          CONTENT1=$(gh api "repos/${SOURCE}/contents/${WF1}" --jq '.content' | tr -d '\n')
          CONTENT2=$(gh api "repos/${SOURCE}/contents/${WF2}" --jq '.content' | tr -d '\n')

          deploy_file() {
            local repo="$1" path="$2" content="$3"
            if gh api "repos/${repo}/contents/${path}" &>/dev/null 2>&1; then
              echo "  ⏭️  $(basename $path): 已存在"
              return
            fi
            jq -n --arg c "$content" \
              "{\"message\":\"chore: deploy $(basename $path)\",\"content\":\$c}" \
            | gh api "repos/${repo}/contents/${path}" --method PUT --input - >/dev/null
            echo "  ✅ $(basename $path): 已部署"
          }

          deploy_to() {
            local repo="$1"
            [[ "$repo" == "$SOURCE" ]] && return

            local w1_ok=false w2_ok=false
            gh api "repos/${repo}/contents/${WF1}" &>/dev/null 2>&1 && w1_ok=true
            gh api "repos/${repo}/contents/${WF2}" &>/dev/null 2>&1 && w2_ok=true

            if $w1_ok && $w2_ok; then
              echo "⏭️  ${repo}: 已全部部署，跳过"
              return
            fi

            echo "🚀 部署到 ${repo}..."
            deploy_file "$repo" "$WF1" "$CONTENT1"
            deploy_file "$repo" "$WF2" "$CONTENT2"

            gh variable set PROJECT_NUMBER --body "$PROJECT_NUM" --repo "$repo"
            gh secret set PROJECT_TOKEN --body "$GH_TOKEN" --repo "$repo"

            printf '{"default_workflow_permissions":"write","can_approve_pull_request_reviews":false}' \
            | gh api "repos/${repo}/actions/permissions/workflow" \
                --method PUT --input - >/dev/null

            KEEP=$(printf '# auto-generated\n' | base64 | tr -d '\n')
            jq -n --arg c "$KEEP" '{"message":"chore: init .github","content":$c}' \
            | gh api "repos/${repo}/contents/.github/.keep" \
                --method PUT --input - >/dev/null || true

            echo "✅ ${repo}: 完成"
          }

          # repository_dispatch：部署到指定仓库
          TARGET="${{ github.event.client_payload.repo }}"
          # workflow_dispatch 手动指定
          [[ -z "$TARGET" ]] && TARGET="${{ inputs.target_repo }}"

          if [[ -n "$TARGET" ]]; then
            deploy_to "$TARGET"
          else
            # 定时扫描：遍历所有未归档仓库
            DEPLOYED=0
            REPOS=$(gh api user/repos --paginate \
              --jq '[.[] | select(.archived == false) | .full_name] | .[]')
            for repo in $REPOS; do
              deploy_to "$repo" && DEPLOYED=$((DEPLOYED + 1)) || true
            done
            echo "📊 本次扫描新部署 ${DEPLOYED} 个"
          fi
